name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-lint:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Run tests
        run: ./Scripts/run-tests.sh 'platform=iOS Simulator,name=iPhone 16,OS=latest'

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: SwiftLint
        run: ./Scripts/run-swiftlint.sh lint
